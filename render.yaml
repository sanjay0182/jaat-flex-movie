services:
  - type: web
    name: jaat-api
    runtime: docker
    plan: free
    envVars:
      - key: PUBLIC_BASE          # apna Render link, e.g. https://jaat-api.onrender.com
        value: https://YOUR-APP.onrender.com
      - key: CORS_ORIGINS         # apna Firebase link (comma se aur bhi laga sakte ho)
        value: https://YOUR-SITE.web.app,https://YOUR-SITE.firebaseapp.com
      - key: DIRECT_IMG           # 0 = images wapas server se
        value: "1"
      - key: DIRECT_VIDEO         # 0 = video server ke /p proxy se (sahi Referer lagta hai)
        value: "0"
