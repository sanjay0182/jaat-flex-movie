<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direct play test</title>
<body style="font-family:sans-serif;background:#111;color:#eee;padding:16px">
<h3>Browser se poora flow test</h3>
<input id="q" value="pattas" style="padding:10px;font-size:16px;width:60%"> 
<button id="b" style="padding:10px 16px;font-size:16px">Test chalao</button>
<pre id="o" style="white-space:pre-wrap;font-size:13px"></pre>
<video id="v" muted playsinline style="width:100%;max-height:200px;background:#000"></video>
<script>
const API="https://h5-api.aoneroom.com/wefeed-h5api-bff",o=document.getElementById("o");
const log=t=>{o.textContent+=t+"\n"};
const XCI='{"timezone":"Asia/Kolkata"}';
const short=x=>String(x).replace(/\s+/g," ").slice(0,140);
async function run(){
  o.textContent="";
  let tok="";
  try{
    const r=await fetch(API+"/home?host=moviebox.ph",{headers:{"X-Client-Info":XCI}});
    const xu=r.headers.get("x-user");
    log("1. /home status "+r.status+" | x-user header: "+(xu?"MILA":"nahi dikha (CORS ne chhupaya)"));
    if(xu){try{tok=JSON.parse(xu).token||""}catch(e){}}
    log("   token: "+(tok?"mil gaya":"nahi mila"));
  }catch(e){log("1. FAIL /home -> "+e.message)}
  const H={"X-Client-Info":XCI};if(tok)H["Authorization"]="Bearer "+tok;
  let item=null;
  try{
    const r=await fetch(API+"/subject/search",{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({keyword:document.getElementById("q").value,page:1,perPage:5})});
    const j=await r.json();const d=j.data||{};const arr=d.items||d.list||[];
    item=arr.find(x=>x.subjectId&&x.detailPath);
    log("2. search status "+r.status+" | items "+arr.length+(item?" | "+item.title:""));
  }catch(e){log("2. FAIL search -> "+e.message)}
  if(!item){log("\nAage nahi bad sakta.");return}
  let dom="";
  try{
    const r=await fetch(API+"/media-player/get-domain",{headers:H});const j=await r.json();
    dom=(typeof j.data==="string"?j.data:"").replace(/\/+$/,"")||"https://netfilm.world";
    log("3. get-domain: "+dom);
  }catch(e){log("3. FAIL get-domain -> "+e.message);return}
  let streams=[];
  const combos=[[0,0],[1,1],[0,1]],pols=["default","no-referrer"];
  outer:
  for(const [se,ep] of combos){for(const pol of pols){
    try{
      const u=dom+"/wefeed-h5api-bff/subject/play?subjectId="+item.subjectId+"&se="+se+"&ep="+ep+"&detailPath="+item.detailPath;
      const hh={...H,"X-Request-Lang":"en"};
      const opt={headers:hh};if(pol==="no-referrer")opt.referrerPolicy="no-referrer";
      const r=await fetch(u,opt);const j=await r.json();const pd=j.data||{};
      const st=(pd.streams||[]).filter(x=>x.url);
      log("4. se"+se+" ep"+ep+" "+pol+" -> http "+r.status+" code "+j.code+" msg "+short(j.message||"")+" | hasResource "+pd.hasResource+" | streams "+st.length+" | hls "+((pd.hls||[]).length));
      if(st.length){streams=st;break outer}
    }catch(e){log("4. se"+se+" ep"+ep+" "+pol+" FAIL -> "+e.message)}
  }}
  if(!streams.length){log("\nStream link nahi mila.");return}
  streams.sort((a,b)=>(a.resolutions||0)-(b.resolutions||0));
  const s=streams[0],su=s.url;
  log("5. video link: "+(s.resolutions||"?")+"p | "+(su.includes(".m3u8")?"hls":"mp4"));
  try{
    const r=await fetch(su,{headers:{Range:"bytes=0-15"}});
    log("6. video fetch status "+r.status);
  }catch(e){log("6. video fetch (JS) FAIL -> "+e.message+" (CORS, par <video> alag baat hai)")}
  const v=document.getElementById("v");
  const res=await new Promise(res=>{
    const t=setTimeout(()=>res("TIMEOUT 10s - metadata nahi aaya"),10000);
    v.onloadedmetadata=()=>{clearTimeout(t);res("CHAL GAYA - duration "+Math.round(v.duration)+"s")};
    v.onerror=()=>{clearTimeout(t);res("ERROR code "+(v.error&&v.error.code))};
    v.src=su;v.load();
  });
  log("7. <video> seedha: "+res);
  log("\nKhatam. Poora screenshot bhej do.");
}
document.getElementById("b").onclick=run;
</script>
